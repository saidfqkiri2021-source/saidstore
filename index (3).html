<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaidStore - متجر التطبيقات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        /* شاشة الحماية (الباسورد) */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        .lock-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #333;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .lock-box input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            outline: none;
        }
        .lock-box input:focus {
            border-color: #2563eb;
        }
        .lock-box button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .lock-box button:hover {
            background: #1d4ed8;
        }
        #error-msg {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* تصميم المتجر الأساسي */
        #store-content {
            display: none; /* مخفي حتى يتكتب الكود الصحيح */
        }
        header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(37,99,235,0.3);
        }
        header h1 {
            margin: 0 0 5px 0;
        }
        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }
        #apps-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-card {
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: right;
            box-sizing: border-box;
            border-right: 5px solid #10b981;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-card img {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
        }
        .app-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .app-info h3 {
            margin: 0 0 5px 0;
            color: #1f2937;
            font-size: 16px;
        }
        .app-info p {
            margin: 0 0 10px 0;
            color: #4b5563;
            font-size: 13px;
            line-height: 1.4;
        }
        .btn {
            background: #10b981;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #059669;
        }
        /* إخفاء العلامة المائية */
        iframe#netlify-badge, div.netlify-badge, a[href*="netlify.com"] {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- شاشة إدخال الكود السري -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>SaidStore 🔐</h2>
            <p>المرجو إدخال كود الدخول للمتجر</p>
            <input type="password" id="passcode" placeholder="أدخل الكود هنا">
            <br>
            <button onclick="checkPassword()">دخول</button>
            <p id="error-msg">الكود غير صحيح، حاول مجدداً!</p>
        </div>
    </div>

    <!-- محتوى المتجر -->
    <div id="store-content">
        <header>
            <h1>SaidStore 📱</h1>
            <p>متجرك الخاص لتنزيل وتجربة التطبيقات والألعاب</p>
        </header>

        <main id="apps-container">
            <p>جاري تحميل التطبيقات من السيرفر...</p>
        </main>
    </div>

    <!-- سكريبت الحماية وجلب البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // دالة التحقق من كلمة المرور
        window.checkPassword = function() {
            const enteredPass = document.getElementById('passcode').value;
            const correctPass = "SAIDANTIBAN20"; // الكود السري الخاص بك

            if (enteredPass === correctPass) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('store-content').style.display = 'block';
                loadApps(); // تحميل التطبيقات بعد نجاح الدخول
            } else {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.style.display = 'block';
                document.getElementById('passcode').value = '';
            }
        };

        // الضغط على Enter لتأكيد الباسورد
        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        const firebaseConfig = {
          apiKey: "AIzaSyA9CONWJPZkD_v6Je08P58QAKidcXXwkOE",
          authDomain: "said-store-a422e.firebaseapp.com",
          projectId: "said-store-a422e",
          storageBucket: "said-store-a422e.firebasestorage.app",
          messagingSenderId: "1096798610792",
          appId: "1:1096798610792:web:f127c55882aee152c9a2dd",
          measurementId: "G-775957Y0DZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadApps() {
            const container = document.getElementById('apps-container');
            
            try {
                const querySnapshot = await getDocs(collection(db, "apps"));
                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color: #666; margin-top: 30px;'>لا توجد تطبيقات في السيرفر حالياً.</p>";
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const appData = doc.data();
                    const appName = appData.name || 'تطبيق بدون اسم';
                    const appDesc = appData.description || 'لا يوجد وصف متاح';
                    const appLink = appData.downloadUrl || '#';
                    const appImage = appData.imageUrl || 'https://via.placeholder.com/80';

                    // تم إضافة onclick لإجبار الروابط (بحال ميديافاير) على الفتح في المتصفح الخارجي Chrome
                    container.innerHTML += `
                        <div class="app-card">
                            <img src="${appImage}" alt="${appName}">
                            <div class="app-info">
                                <h3>${appName}</h3>
                                <p>${appDesc}</p>
                                <a href="${appLink}" class="btn" target="_blank" onclick="window.open('${appLink}', '_system'); return false;">تحميل APK</a>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("خطأ في جلب البيانات: ", error);
                container.innerHTML = "<p style='color: red; margin-top: 30px;'>حدث خطأ أثناء الاتصال بالسيرفر.</p>";
            }
        }
    </script>

</body>
</html>
