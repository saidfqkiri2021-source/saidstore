<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Said TV Live - النسخة المطورة والنهائية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .light .glass-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.08); }
        .channel-card { transition: all 0.2s ease; }
        .channel-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 transition-colors duration-300">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-900/90 border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-2xl shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-satellite-dish text-xl text-indigo-200"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">Said TV Live</h1>
                    <p class="text-[10px] text-slate-400 font-medium">البث المباشر والاشتراك الفعلي</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap justify-center">
                <a href="https://t.me/SAIDANTIBAN1" target="_blank" class="px-3.5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-xs font-bold shadow-lg shadow-sky-500/20 flex items-center gap-2 transition">
                    <i class="fa-brands fa-telegram text-sm"></i>
                    <span>قناة التليجرام</span>
                </a>
                <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="الوضع الليلي/النهاري">
                    <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <!-- Video Player Column -->
        <div class="lg:col-span-2 flex flex-col space-y-3">
            
            <div class="relative bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-800 aspect-video flex items-center justify-center group">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                
                <!-- External Player & Zoom Buttons -->
                <div class="absolute top-3 left-3 flex gap-2 z-20">
                    <a id="externalPlayerBtn" href="#" target="_blank" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl backdrop-blur-md text-xs font-bold items-center gap-1.5 shadow-lg transition" title="فتح في مشغل خارجي مثل VLC">
                        <i class="fa-solid fa-external-link-alt"></i> فتح بالمشغل الخارجي
                    </a>
                </div>

                <div id="playerOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-10">
                    <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mb-3 border border-indigo-500/30 shadow-lg animate-bounce">
                        <i class="fa-solid fa-tv text-2xl"></i>
                    </div>
                    <h3 class="text-base sm:text-lg font-bold text-white mb-1">اختر قناة من القائمة الجانبية</h3>
                    <p class="text-xs text-slate-400">إذا واجهتك مشكلة في المتصفح، استخدم زر "فتح بالمشغل الخارجي"</p>
                </div>
            </div>

            <!-- Active Channel Bar -->
            <div class="glass-panel rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl">
                <div class="flex items-center space-x-3 space-x-reverse w-full sm:w-auto">
                    <img id="currentLogo" src="https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop" class="w-12 h-12 rounded-xl object-cover border border-slate-700 shadow" alt="">
                    <div class="min-w-0">
                        <h2 id="currentTitle" class="text-sm sm:text-base font-bold text-white truncate">لم يتم اختيار قناة</h2>
                        <p id="currentCategory" class="text-[11px] text-indigo-400 font-medium truncate">اختر قناة للبدء</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="reloadStream()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-1.5 shadow transition">
                        <i class="fa-solid fa-rotate"></i> تحديث
                    </button>
                </div>
            </div>

        </div>

        <!-- Channels Directory Column -->
        <div class="glass-panel rounded-3xl p-3 sm:p-4 flex flex-col h-[550px] lg:h-[620px] shadow-2xl">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-xs sm:text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-list text-indigo-400"></i> قائمة القنوات
                </h3>
                <span id="channelCount" class="text-[11px] bg-slate-800 text-indigo-300 px-2.5 py-1 rounded-lg font-bold">0 قناة</span>
            </div>

            <!-- Search Field -->
            <div class="mb-2.5">
                <input type="text" id="searchInput" placeholder="ابحث عن قناة أو باقة..." oninput="searchChannels()" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- Categories Horizontal Filter -->
            <div id="categoriesContainer" class="flex gap-1.5 overflow-x-auto pb-2 mb-2.5 scrollbar-none">
                <button onclick="filterCategory('الكل')" class="cat-btn active px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white whitespace-nowrap shadow transition">الكل</button>
            </div>

            <!-- Channels Scrollable List -->
            <div id="channelsList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-center py-16 text-slate-400 text-xs">جاري تحميل القنوات...</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-[11px] text-slate-500 border-t border-slate-800 mt-auto">
        Said TV Live &copy; 2026 - جميع الحقوق محفوظة
    </footer>

    <script>
        let allChannels = [];
        let currentCategory = 'الكل';
        let currentChannel = null;
        let hls = null;

        async function loadChannels() {
            try {
                const res = await fetch('channels.json');
                allChannels = await res.json();
                buildCategories();
                renderChannels('الكل');
            } catch (e) {
                console.error("Error loading channels:", e);
                document.getElementById('channelsList').innerHTML = '<div class="text-center py-10 text-red-400 text-xs">فشل تحميل القنوات. تأكد من وجود channels.json</div>';
            }
        }

        function buildCategories() {
            const catsSet = new Set();
            allChannels.forEach(c => {
                if (c.group) catsSet.add(c.group);
            });
            const container = document.getElementById('categoriesContainer');
            catsSet.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap transition border border-slate-700';
                btn.textContent = cat;
                btn.onclick = () => filterCategory(cat);
                container.appendChild(btn);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.textContent === cat) {
                    btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white whitespace-nowrap shadow transition';
                } else {
                    btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap transition border border-slate-700';
                }
            });
            renderChannels(cat);
        }

        function searchChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
            displayChannelsList(filtered);
        }

        function renderChannels(cat) {
            const filtered = cat === 'الكل' ? allChannels : allChannels.filter(c => c.group === cat);
            displayChannelsList(filtered);
        }

        function displayChannelsList(channels) {
            const listEl = document.getElementById('channelsList');
            listEl.innerHTML = '';
            document.getElementById('channelCount').textContent = `${channels.length} قناة`;

            if (channels.length === 0) {
                listEl.innerHTML = '<div class="text-center py-10 text-slate-500 text-xs">لا توجد قنوات مطابقة</div>';
                return;
            }

            channels.forEach(channel => {
                const isSelected = currentChannel && currentChannel.url === channel.url;
                const div = document.createElement('div');
                div.className = `channel-card flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition border ${isSelected ? 'bg-indigo-600/25 border-indigo-500 shadow-md' : 'bg-slate-900/60 border-slate-800 hover:bg-slate-800'}`;
                div.onclick = () => playChannel(channel);
                
                const logoImg = channel.logo && channel.logo.startsWith('http') ? channel.logo : 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop';

                div.innerHTML = `
                    <div class="flex items-center space-x-2.5 space-x-reverse truncate">
                        <img src="${logoImg}" class="w-9 h-9 rounded-lg object-cover border border-slate-700 flex-shrink-0" alt="" onerror="this.src='https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop'">
                        <div class="truncate">
                            <h4 class="font-bold text-xs text-white truncate">${channel.name}</h4>
                            <span class="text-[10px] text-indigo-400 truncate block">${channel.group}</span>
                        </div>
                    </div>
                    <div class="text-xs ${isSelected ? 'text-indigo-400 font-bold' : 'text-slate-500'} flex-shrink-0 pr-1">
                        <i class="fa-solid ${isSelected ? 'fa-satellite-dish animate-pulse' : 'fa-play'}"></i>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function playChannel(channel) {
            currentChannel = channel;
            document.getElementById('currentTitle').textContent = channel.name;
            document.getElementById('currentCategory').textContent = channel.group;
            if (channel.logo && channel.logo.startsWith('http')) {
                document.getElementById('currentLogo').src = channel.logo;
            }
            document.getElementById('playerOverlay').classList.add('opacity-0', 'pointer-events-none');
            
            // Show external player button
            const extBtn = document.getElementById('externalPlayerBtn');
            extBtn.href = channel.url;
            extBtn.classList.remove('hidden');
            extBtn.classList.add('flex');

            const video = document.getElementById('videoPlayer');

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            }

            renderChannels(currentCategory);
        }

        function reloadStream() {
            if (currentChannel) {
                playChannel(currentChannel);
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                document.body.className = "min-h-screen flex flex-col bg-slate-100 text-slate-900 transition-colors duration-300";
                themeIcon.className = "fa-solid fa-sun text-xs text-amber-500";
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                document.body.className = "min-h-screen flex flex-col bg-slate-950 text-slate-100 transition-colors duration-300";
                themeIcon.className = "fa-solid fa-moon text-xs text-slate-300";
            }
        }

        loadChannels();
    </script>
</body>
</html>
