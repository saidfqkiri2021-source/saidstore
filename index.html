<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قنوات عربية - IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; }
    header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #334155;
    }
    header h1 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tg-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: 0.2s;
    }
    .tg-btn:hover {
      background: #1b86b8;
      transform: translateY(-1px);
    }
    .tg-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .count { background: #0284c7; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; }
    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1300px;
      margin: auto;
    }
    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }
    .player-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    video { width: 100%; max-height: 480px; background: #000; display: block; }
    .now-playing {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .channels-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      max-height: 550px;
      overflow-y: auto;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #0f172a;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .channel-item:hover { border-color: #38bdf8; }
    .channel-item.active { background: #0369a1; border-color: #7dd3fc; }
    .channel-item img {
      width: 44px;
      height: 30px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      padding: 2px;
      flex-shrink: 0;
    }
    .channel-info { flex: 1; }
    .channel-name { font-size: 0.95rem; font-weight: bold; }
    .channel-tag { font-size: 0.75rem; color: #94a3b8; }
    .status { font-size: 0.85rem; color: #38bdf8; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>القنوات العربية المختارة</h1>
    <div class="header-actions">
      <a href="https://t.me/SAIDANTIBAN1" target="_blank" rel="noopener noreferrer" class="tg-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        قناتنا على تيليجرام
      </a>
      <span class="count" id="channelCount">0 قنوات</span>
    </div>
  </header>

  <div class="container">
    <div class="player-box">
      <video id="videoPlayer" controls playsinline></video>
      <div class="now-playing">
        <div>
          <div id="currentTitle">اختر قناة للتشغيل</div>
          <div id="currentSub" style="font-size: 0.8rem; color: #94a3b8;">جاهز</div>
        </div>
        <span class="status" id="playerStatus">متوقف</span>
      </div>
    </div>

    <div class="channels-box" id="channelsList"></div>
  </div>

  <script>
    const allChannels = [
      {
        name: "Aflam",
        url: "https://shd-amg-fast.edgenextcdn.net/tx001/playlist.m3u8",
        logo: "https://i.imgur.com/cTLj7Yt.png",
        tag: "أفلام عربية"
      },
      {
        name: "MBC Bollywood",
        url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-bollywood/546eb40d7dcf9a209255dd2496903764/index.m3u8",
        logo: "https://i.imgur.com/TTAGFHG.png",
        tag: "مترجم / مدبلج (قد يحتاج VPN)"
      },
      {
        name: "MBC+ Drama",
        url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-plus-drama/e37251ec2aac8f6c98f75cd0fa37cd28/index.m3u8",
        logo: "https://i.imgur.com/lxWdjXG.png",
        tag: "دراما عربية"
      },
      {
        name: "Mix Hollywood",
        url: "https://ml-pull-hwc.myco.io/MixTV/hls/index.m3u8",
        logo: "https://i.imgur.com/1ENdbZn.png",
        tag: "أفلام مترجمة للعربية"
      },
      {
        name: "Movies Action",
        url: "https://shd-amg-fast.edgenextcdn.net/tx011/playlist.m3u8",
        logo: "https://i.imgur.com/NIVhISa.png",
        tag: "أكشن مترجم للعربية"
      },
      {
        name: "Movies Thriller",
        url: "https://shd-amg-fast.edgenextcdn.net/tx012/playlist.m3u8",
        logo: "https://i.imgur.com/JWihdcl.png",
        tag: "إثارة مترجمة للعربية"
      },
      {
        name: "Nile Drama",
        url: "http://185.9.2.18/chid_352/index.m3u8",
        logo: "https://i.imgur.com/FasJFMM.png",
        tag: "دراما مصرية (رابط HTTP)"
      },
      {
        name: "Rotana Cinema Egypt",
        url: "https://rotana.hibridcdn.net/rotananet/cinemamasr_net-7Y83PP5adWixDF93/playlist.m3u8",
        logo: "https://i.imgur.com/dGlKoLW.png",
        tag: "أفلام مصرية (قد يحتاج VPN)"
      },
      {
        name: "Rotana Cinema KSA",
        url: "https://r.eu.cdn-redge.media/livehls/oeu/mt/live/rotana_cinema/live.livx/playlist.m3u8",
        logo: "https://i.imgur.com/pGgp38I.png",
        tag: "أفلام عربية"
      }
    ];

    const video = document.getElementById("videoPlayer");
    const listEl = document.getElementById("channelsList");
    const countEl = document.getElementById("channelCount");
    const titleEl = document.getElementById("currentTitle");
    const subEl = document.getElementById("currentSub");
    const statusEl = document.getElementById("playerStatus");

    let hls = null;
    countEl.textContent = `${allChannels.length} قنوات`;

    function cleanupPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function playChannel(channel, element, shouldAutoplay = true) {
      document.querySelectorAll(".channel-item").forEach(el => el.classList.remove("active"));
      if (element) element.classList.add("active");

      titleEl.textContent = channel.name;
      subEl.textContent = channel.tag;
      statusEl.textContent = "جاري التحميل...";

      cleanupPlayer();

      if (window.location.protocol === "https:" && channel.url.startsWith("http://")) {
        statusEl.textContent = "رابط HTTP غير مدعوم على HTTPS";
        return;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(channel.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          statusEl.textContent = "مباشر";
          if (shouldAutoplay) {
            video.play().catch(() => {
              statusEl.textContent = "جاهز للتشغيل";
            });
          }
        });

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data && data.fatal) {
            statusEl.textContent = "تعذر التشغيل / محجوب";
            if (hls) {
              hls.destroy();
              hls = null;
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.url;
        const onLoaded = () => {
          statusEl.textContent = "مباشر";
          if (shouldAutoplay) {
            video.play().catch(() => {
              statusEl.textContent = "جاهز للتشغيل";
            });
          }
        };
        const onError = () => {
          statusEl.textContent = "تعذر التشغيل / محجوب";
        };
        video.addEventListener("loadedmetadata", onLoaded, { once: true });
        video.addEventListener("error", onError, { once: true });
      } else {
        statusEl.textContent = "المتصفح لا يدعم HLS";
      }
    }

    allChannels.forEach((ch, index) => {
      const item = document.createElement("div");
      item.className = "channel-item";

      const img = document.createElement("img");
      img.src = ch.logo;
      img.alt = ch.name;
      img.onerror = () => { img.style.display = "none"; };

      const info = document.createElement("div");
      info.className = "channel-info";

      const nameDiv = document.createElement("div");
      nameDiv.className = "channel-name";
      nameDiv.textContent = ch.name;

      const tagDiv = document.createElement("div");
      tagDiv.className = "channel-tag";
      tagDiv.textContent = ch.tag;

      info.appendChild(nameDiv);
      info.appendChild(tagDiv);
      item.appendChild(img);
      item.appendChild(info);

      item.onclick = () => playChannel(ch, item, true);
      listEl.appendChild(item);

      if (index === 0) {
        playChannel(ch, item, false);
      }
    });
  </script>
</body>
</html>
