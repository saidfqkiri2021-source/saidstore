<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale5.0">
    <title>SaidStore - متجر التطبيقات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        .app-card {
            background: white;
            padding: 15px;
            margin: 15px auto;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: right;
        }
        .btn {
            background: #10b981;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SaidStore 📱</h1>
        <p>متجرك الخاص لتحميل أحدث تطبيقات الأندرويد</p>
    </header>

    <main>
        <div class="app-card">
            <h3>تطبيق التجربة (Example App)</h3>
            <p>هذا أول تطبيق تجريبي متوفر للتحميل على متجرك.</p>
            <a href="#" class="btn">تحميل APK</a>
        </div>
    </main>

</body>
</html>
