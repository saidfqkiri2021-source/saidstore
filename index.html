<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Said TV Live - البث المباشر</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .channel-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30 flex items-center justify-center">
                    <i class="fa-solid fa-tv text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">Said TV Live</h1>
                    <p class="text-xs text-slate-400">بث مباشر (قنوات رياضية، أفلام، وأطفال)</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20">
                    <span class="w-2 h-2 mr-1.5 bg-red-500 rounded-full animate-pulse"></span>
                    متصل
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Video Player Section -->
        <div class="lg:col-span-2 flex flex-col space-y-4">
            <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 aspect-video flex items-center justify-center group">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                <div id="playerOverlay" class="absolute inset-0 bg-slate-950/85 flex flex-col items-center justify-center p-6 text-center transition-opacity z-10">
                    <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mb-4 border border-blue-500/30">
                        <i class="fa-solid fa-play text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1">اختر قناة لبدء المشاهدة</h3>
                    <p class="text-sm text-slate-400">اختر من القائمة الجانبية وتصفح حسب القسم أو الدولة</p>
                </div>
            </div>

            <!-- Current Channel Info & Controls -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-lg">
                <div class="flex items-center space-x-3 space-x-reverse w-full sm:w-auto">
                    <img id="currentLogo" src="https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop" class="w-12 h-12 rounded-xl object-cover border border-slate-700" alt="Channel">
                    <div>
                        <h2 id="currentTitle" class="text-lg font-bold text-white">لم يتم اختيار قناة</h2>
                        <p id="currentCategory" class="text-xs text-blue-400 font-medium">اختر قناة من القائمة الجانبية</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="toggleFavorite()" id="favBtn" class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700 text-xs font-semibold flex items-center gap-2" title="إضافة للمفضلة">
                        <i class="fa-regular fa-heart text-base text-red-400"></i> المفضلة
                    </button>
                    <button onclick="reloadStream()" class="px-3.5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition shadow-md shadow-blue-600/30 text-xs font-semibold flex items-center gap-2" title="تحديث البث">
                        <i class="fa-solid fa-rotate"></i> إعادة تحميل
                    </button>
                </div>
            </div>
        </div>

        <!-- Channels List & Categories -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col h-[600px] shadow-lg">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <h3 class="font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-satellite-dish text-blue-400"></i> قائمة القنوات والأقسام
                </h3>
                <span id="channelCount" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700">0 قناة</span>
            </div>

            <!-- Search Box -->
            <div class="mb-3">
                <input type="text" id="searchInput" placeholder="ابحث عن قناة..." oninput="searchChannels()" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- Categories Filter -->
            <div id="categoriesContainer" class="flex gap-2 overflow-x-auto pb-3 mb-3 scrollbar-none">
                <button onclick="filterCategory('الكل')" class="cat-btn active px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white whitespace-nowrap shadow-md shadow-blue-600/30 transition">الكل</button>
            </div>

            <!-- Channels Container -->
            <div id="channelsList" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                <div class="text-center py-10 text-slate-400 text-xs">جاري تحميل القنوات...</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800 mt-auto">
        Said TV Live &copy; 2026 - جميع الحقوق محفوظة
    </footer>

    <script>
        // مصفوفة القنوات الكاملة داخل الكود مباشرة بدون ملفات خارجية
        const allChannels = [
            // المغرب
            { name: "2M Monde HD", url: "https://r.eu.cdn-redge.media/livehls/oeu/mt/live/2m_monde/live.livx/playlist.m3u8", logo: "https://i.imgur.com/MvpntzA.png", group: "المغرب" },
            { name: "Al Maghribia (1080p)", url: "https://d2qh3gh0k5vp3v.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-n6pess5lwbghr/2M_ES.m3u8", logo: "https://i.imgur.com/7GaahYh.png", group: "المغرب" },
            { name: "Chada TV (720p)", url: "https://edge13.vedge.infomaniak.com/livecast/ik:chadatv/manifest.m3u8", logo: "https://freebox.cdn.scw.iliad.fr/medium_Logo_chada_tv_2ee1412d38.png", group: "المغرب" },
            
            // الجزائر
            { name: "CNA (Algeria)", url: "https://live.creacast.com/cna/stream/playlist.m3u8", logo: "https://i.imgur.com/Ki3ySUE.png", group: "الجزائر" },
            
            // تونس
            { name: "Wataniya 1 HD", url: "https://live.tanitweb.com/wataniya1/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/ar/2/25/Wataniya_1_logo.png", group: "تونس" },
            
            // مصر
            { name: "Rotana Cinema Egypt", url: "https://rotana.hibridcdn.net/rotananet/cinemamasr_net-7Y83PP5adWixDF93/playlist.m3u8", logo: "https://i.imgur.com/dGlKoLW.png", group: "مصر" },
            
            // السعودية
            { name: "Rotana Cinema KSA", url: "https://r.eu.cdn-redge.media/livehls/oeu/mt/live/rotana_cinema/live.livx/playlist.m3u8", logo: "https://i.imgur.com/pGgp38I.png", group: "السعودية" },
            
            // أفلام ومسلسلات
            { name: "Aflam", url: "https://shd-amg-fast.edgenextcdn.net/tx001/playlist.m3u8", logo: "https://i.imgur.com/cTLj7Yt.png", group: "أفلام ومسلسلات" },
            { name: "MBC Bollywood", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-bollywood/546eb40d7dcf9a209255dd2496903764/index.m3u8", logo: "https://i.imgur.com/TTAGFHG.png", group: "أفلام ومسلسلات" },
            { name: "MBC+ Drama", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-plus-drama/e37251ec2aac8f6c98f75cd0fa37cd28/index.m3u8", logo: "https://i.imgur.com/lxWdjXG.png", group: "أفلام ومسلسلات" },
            { name: "Mix Hollywood", url: "https://ml-pull-hwc.myco.io/MixTV/hls/index.m3u8", logo: "https://i.imgur.com/1ENdbZn.png", group: "أفلام ومسلسلات" },
            { name: "Movies Action", url: "https://shd-amg-fast.edgenextcdn.net/tx011/playlist.m3u8", logo: "https://i.imgur.com/NIVhISa.png", group: "أفلام ومسلسلات" },
            { name: "Movies Thriller", url: "https://shd-amg-fast.edgenextcdn.net/tx012/playlist.m3u8", logo: "https://i.imgur.com/JWihdcl.png", group: "أفلام ومسلسلات" },
            
            // رياضة
            { name: "Arryadia (720p)", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-bollywood/546eb40d7dcf9a209255dd2496903764/index.m3u8", logo: "https://i.imgur.com/XjzK3gZ.png", group: "رياضة" },
            
            // أطفال
            { name: "Spacetoon Arabic", url: "https://live-uae-next.spacetoongo.com/ST_MENA_NEXT/hls/r9p2hjipmw2kl.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/2/2b/Spacetoon_logo.png", group: "أطفال" },
            { name: "Atfal & Mawaheb TV", url: "https://5aafcc5de91f1.streamlock.net/atfal1.com/atfal2/playlist.m3u8", logo: "https://i.imgur.com/Y2BqP9m.png", group: "أطفال" },
            { name: "Sat 7 Kids", url: "https://svs.itworkscdn.net/sat7kidslive/sat7kids.smil/playlist_dvr.m3u8", logo: "https://i.imgur.com/M0ik0i2.png", group: "أطفال" },
            { name: "Taha TV", url: "https://stream.starmenajo.com/hls/app/live/ts:fhd.m3u8", logo: "https://i.imgur.com/hdsrxvX.png", group: "أطفال" },
            { name: "Koogi TV", url: "https://5d658d7e9f562.streamlock.net/koogi.tv/koogi.smil/playlist.m3u8", logo: "https://i.imgur.com/zojMTP9.png", group: "أطفال" },
            { name: "TRT Cocuk", url: "https://tv-trtcocuk.medya.trt.com.tr/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/TRT_%C3%87ocuk_logo_%282021%29.svg/960px-TRT_%C3%87ocuk_logo_%282021%29.svg.png", group: "أطفال" },
            { name: "Pooya TV", url: "https://ncdn.telewebion.ir/pooya/live/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/fa/5/5a/POOYA_tv_2.png", group: "أطفال" },
            { name: "Sony Yay!", url: "https://r2.amml.in/sony-yay/live.m3u8", logo: "https://dtil.tmsimg.com/assets/s159100_ld_h15_aa.png?lock=720x540", group: "أطفال" },
            
            // أخبار
            { name: "Medi1TV Arabic (1080p)", url: "https://cdn.live.easybroadcast.io/abr_corp/83_medi1tv-arabic_g90v4ec/playlist.m3u8", logo: "https://i.imgur.com/3YsZPY6.jpeg", group: "أخبار" },
            { name: "Medi1TV Afrique (1080p)", url: "https://cdn.live.easybroadcast.io/abr_corp/83_medi1tv-afrique_tm7tu45/playlist.m3u8", logo: "https://i.imgur.com/a20DHnj.png", group: "أخبار" },
            
            // موسيقى وأغاني (جاهز)
            // { name: "اسم القناة", url: "رابط البث", logo: "رابط الشعار", group: "موسيقى وأغاني" },

            // عالمية وعامة
            { name: "MBC 5 (1080p)", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-5/ee6b000cee0629411b666ab26cb13e9b/index.m3u8", logo: "https://i.imgur.com/fRWaDyF.png", group: "عالمية وعامة" },
            { name: "StoryChannel TV (720p)", url: "https://136044159.r.cdnsun.net/storychannel.m3u8", logo: "https://i.imgur.com/ZBV6xph.png", group: "عالمية وعامة" }
        ];

        let currentCategory = 'الكل';
        let currentChannel = null;
        let hls = null;

        function initApp() {
            buildCategories();
            renderChannels('الكل');
        }

        function buildCategories() {
            const catsSet = new Set();
            allChannels.forEach(c => {
                if (c.group) catsSet.add(c.group);
            });
            const container = document.getElementById('categoriesContainer');
            catsSet.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap transition border border-slate-700';
                btn.textContent = cat;
                btn.onclick = () => filterCategory(cat);
                container.appendChild(btn);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.textContent === cat) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/30');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/30');
                    btn.classList.add('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
                }
            });
            renderChannels(cat);
        }

        function searchChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
            displayChannelsList(filtered);
        }

        function renderChannels(cat) {
            const filtered = cat === 'الكل' ? allChannels : allChannels.filter(c => c.group === cat);
            displayChannelsList(filtered);
        }

        function displayChannelsList(channels) {
            const listEl = document.getElementById('channelsList');
            listEl.innerHTML = '';
            document.getElementById('channelCount').textContent = `${channels.length} قناة`;

            if (channels.length === 0) {
                listEl.innerHTML = '<div class="text-center py-10 text-slate-500 text-xs">لا توجد قنوات مطابقة</div>';
                return;
            }

            channels.forEach(channel => {
                const isSelected = currentChannel && currentChannel.url === channel.url;
                const div = document.createElement('div');
                div.className = `channel-card flex items-center justify-between p-3 rounded-xl cursor-pointer transition border ${isSelected ? 'bg-blue-600/20 border-blue-500 shadow-md shadow-blue-500/10' : 'bg-slate-800/50 border-slate-700/60 hover:bg-slate-800 hover:border-slate-600'}`;
                div.onclick = () => playChannel(channel);
                
                const logoImg = channel.logo && channel.logo.startsWith('http') ? channel.logo : 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop';

                div.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse truncate">
                        <img src="${logoImg}" class="w-10 h-10 rounded-lg object-cover border border-slate-700 flex-shrink-0" alt="" onerror="this.src='https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop'">
                        <div class="truncate">
                            <h4 class="font-bold text-sm text-white truncate">${channel.name}</h4>
                            <span class="text-[11px] text-slate-400 truncate">${channel.group}</span>
                        </div>
                    </div>
                    <div class="text-xs ${isSelected ? 'text-blue-400 font-bold' : 'text-slate-500'} flex-shrink-0 pr-2">
                        <i class="fa-solid ${isSelected ? 'fa-signal animate-pulse' : 'fa-play'}"></i>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function playChannel(channel) {
            currentChannel = channel;
            document.getElementById('currentTitle').textContent = channel.name;
            document.getElementById('currentCategory').textContent = channel.group;
            if (channel.logo && channel.logo.startsWith('http')) {
                document.getElementById('currentLogo').src = channel.logo;
            }
            document.getElementById('playerOverlay').classList.add('opacity-0', 'pointer-events-none');

            const video = document.getElementById('videoPlayer');

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            }

            renderChannels(currentCategory);
        }

        function reloadStream() {
            if (currentChannel) {
                playChannel(currentChannel);
            }
        }

        function toggleFavorite() {
            const btn = document.getElementById('favBtn');
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular', 'text-red-400');
                icon.classList.add('fa-solid', 'text-red-500');
            } else {
                icon.classList.remove('fa-solid', 'text-red-500');
                icon.classList.add('fa-regular', 'text-red-400');
            }
        }

        initApp();
    </script>
</body>
</html>
