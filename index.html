<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تطبيق القنوات الفضائية - IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-item: #f1f5f9;
      --bg-item-hover: #e2e8f0;
      --bg-item-active: #0284c7;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #cbd5e1;
      --primary: #0284c7;
    }
    html.dark {
      --bg-main: #0f172a;
      --bg-header: #1e293b;
      --bg-card: #1e293b;
      --bg-item: #0f172a;
      --bg-item-hover: #1e293b;
      --bg-item-active: #0369a1;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --primary: #38bdf8;
    }

    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; transition: background 0.2s, color 0.2s; }
    body { margin: 0; background: var(--bg-main); color: var(--text-main); }
    
    header {
      background: var(--bg-header);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      display: none; /* مخفي افتراضياً ولا يظهر إلا عند الفلترة */
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      gap: 5px;
      font-size: 0.9rem;
    }
    .back-btn:hover { background: var(--bg-item-hover); }
    header h1 { margin: 0; font-size: 1.1rem; color: var(--primary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-btn {
      background: var(--bg-item);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .action-btn:hover { background: var(--bg-item-hover); }
    .tg-btn { background: #229ED9; color: #fff; border: none; font-weight: bold; border-radius: 999px; }
    .tg-btn:hover { background: #1b86b8; }
    
    .count { background: var(--primary); color: #fff; padding: 5px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: bold; }

    .filter-section {
      max-width: 1300px;
      margin: 16px auto 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    
    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-btn:hover { background: var(--bg-item-hover); }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1300px;
      margin: auto;
    }
    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    .player-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    video { width: 100%; max-height: 480px; background: #000; display: block; }
    .now-playing {
      padding: 12px 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .channels-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      max-height: 550px;
      overflow-y: auto;
    }

    .group-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary);
      margin: 12px 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border-color);
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: var(--bg-item);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .channel-item:hover { border-color: var(--primary); background: var(--bg-item-hover); }
    .channel-item.active { background: var(--bg-item-active); border-color: var(--primary); color: #fff; }
    .channel-item.active .channel-tag { color: #e0f2fe; }

    .channel-item img {
      width: 44px;
      height: 30px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      padding: 2px;
      flex-shrink: 0;
    }
    .channel-info { flex: 1; }
    .channel-name { font-size: 0.95rem; font-weight: bold; }
    .channel-tag { font-size: 0.75rem; color: var(--text-sub); }
    .status { font-size: 0.85rem; color: var(--primary); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <button class="back-btn" id="backBtn" onclick="goHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        رجوع
      </button>
      <h1>قنوات عربية وعالمية - IPTV</h1>
    </div>
    <div class="header-actions">
      <button class="action-btn" id="themeToggle" onclick="toggleTheme()">🌙 الوضع الليلي</button>
      <a href="https://t.me/SAIDANTIBAN1" target="_blank" rel="noopener noreferrer" class="action-btn tg-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        تيليجرام
      </a>
      <span class="count" id="channelCount">0 قنوات</span>
    </div>
  </header>

  <div class="filter-section">
    <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم القناة..." oninput="filterChannels()" />
    
    <!-- الأقسام والبلدان المزرة -->
    <div class="tabs-container" id="tabsContainer">
      <button class="tab-btn active" onclick="setCategory('all', this)">الكل</button>
      <button class="tab-btn" onclick="setCategory('المغرب', this)">🇲🇦 المغرب</button>
      <button class="tab-btn" onclick="setCategory('الجزائر', this)">🇩🇿 الجزائر</button>
      <button class="tab-btn" onclick="setCategory('تونس', this)">🇹🇳 تونس</button>

      <button class="tab-btn" onclick="setCategory('السعودية', this)">🇸🇦 السعودية</button>
      <button class="tab-btn" onclick="setCategory('أفلام', this)">🎬 أفلام ومسلسلات</button>
      <button class="tab-btn" onclick="setCategory('رياضة', this)">⚽ رياضة</button>
      <button class="tab-btn" onclick="setCategory('أطفال', this)">🧸 أطفال</button>
      <button class="tab-btn" onclick="setCategory('أخبار', this)">📰 أخبار</button>
      <button class="tab-btn" onclick="setCategory('موسيقى', this)">🎵 موسيقى وأغاني</button>
      <button class="tab-btn" onclick="setCategory('عالمية', this)">🌍 عالمية وعامة</button>
    </div>
  </div>

  <div class="container">
    <div class="player-box">
      <video id="videoPlayer" controls playsinline></video>
      <div class="now-playing">
        <div>
          <div id="currentTitle" style="font-weight: bold;">اختر قناة للتشغيل</div>
          <div id="currentSub" style="font-size: 0.8rem; color: var(--text-sub);">جاهز</div>
        </div>
        <span class="status" id="playerStatus">متوقف</span>
      </div>
    </div>

    <div class="channels-box" id="channelsList"></div>
  </div>

  <script>

      { name: "Rotana Cinema KSA", url: "https://r.eu.cdn-redge.media/livehls/oeu/mt/live/rotana_cinema/live.livx/playlist.m3u8", logo: "https://i.imgur.com/pGgp38I.png", tag: "أفلام عربية", type: "category", group: "أفلام ومسلسلات" },

      // 🧸 أطفال
      { name: "Spacetoon Arabic", url: "https://live-uae-next.spacetoongo.com/ST_MENA_NEXT/hls/r9p2hjipmw2kl.m3u8", logo: "https://upload.wikimedia.org/wikipedia/en/2/2b/Spacetoon_logo.png", tag: "أطفال عربي", type: "category", group: "أطفال" },
      { name: "Atfal & Mawaheb TV", url: "https://5aafcc5de91f1.streamlock.net/atfal1.com/atfal2/playlist.m3u8", logo: "https://i.imgur.com/Y2BqP9m.png", tag: "أطفال", type: "category", group: "أطفال" },
      { name: "Sat 7 Kids", url: "https://svs.itworkscdn.net/sat7kidslive/sat7kids.smil/playlist_dvr.m3u8", logo: "https://i.imgur.com/M0ik0i2.png", tag: "أطفال", type: "category", group: "أطفال" },
      { name: "Taha TV", url: "https://stream.starmenajo.com/hls/app/live/ts:fhd.m3u8", logo: "https://i.imgur.com/hdsrxvX.png", tag: "أطفال", type: "category", group: "أطفال" },
      { name: "Koogi TV", url: "https://5d658d7e9f562.streamlock.net/koogi.tv/koogi.smil/playlist.m3u8", logo: "https://i.imgur.com/zojMTP9.png", tag: "أطفال مصر", type: "category", group: "أطفال" },
      { name: "TRT Cocuk", url: "https://tv-trtcocuk.medya.trt.com.tr/master.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/TRT_%C3%87ocuk_logo_%282021%29.svg/960px-TRT_%C3%87ocuk_logo_%282021%29.svg.png", tag: "تركيا", type: "category", group: "أطفال" },
      { name: "Pooya TV", url: "https://ncdn.telewebion.ir/pooya/live/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/fa/5/5a/POOYA_tv_2.png", tag: "إيران", type: "category", group: "أطفال" },
      { name: "Sony Yay!", url: "https://r2.amml.in/sony-yay/live.m3u8", logo: "https://dtil.tmsimg.com/assets/s159100_ld_h15_aa.png?lock=720x540", tag: "الهند", type: "category", group: "أطفال" },

      // 📰 أخبار
      { name: "Medi1TV Arabic (1080p)", url: "https://cdn.live.easybroadcast.io/abr_corp/83_medi1tv-arabic_g90v4ec/playlist.m3u8", logo: "https://i.imgur.com/3YsZPY6.jpeg", tag: "News", type: "category", group: "أخبار" },
      { name: "Medi1TV Afrique (1080p)", url: "https://cdn.live.easybroadcast.io/abr_corp/83_medi1tv-afrique_tm7tu45/playlist.m3u8", logo: "https://i.imgur.com/a20DHnj.png", tag: "News", type: "category", group: "أخبار" },

      // 🌍 عالمية وعامة
      { name: "MBC 5 (1080p)", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-5/ee6b000cee0629411b666ab26cb13e9b/index.m3u8", logo: "https://i.imgur.com/fRWaDyF.png", tag: "Family", type: "category", group: "عالمية وعامة" },
      { name: "StoryChannel TV (720p)", url: "https://136044159.r.cdnsun.net/storychannel.m3u8", logo: "https://i.imgur.com/ZBV6xph.png", tag: "Culture", type: "category", group: "عالمية وعامة" }
    ];

    const video = document.getElementById("videoPlayer");
    const listEl = document.getElementById("channelsList");
    const countEl = document.getElementById("channelCount");
    const titleEl = document.getElementById("currentTitle");
    const subEl = document.getElementById("currentSub");
    const statusEl = document.getElementById("playerStatus");
    const themeBtn = document.getElementById("themeToggle");
    const backBtn = document.getElementById("backBtn");

    let hls = null;
    let currentCategory = "all";

    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        themeBtn.textContent = "☀️ الوضع النهاري";
      } else {
        html.classList.add("dark");
        themeBtn.textContent = "🌙 الوضع الليلي";
      }
    }

    function cleanupPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function playChannel(channel, element, shouldAutoplay = true) {
      document.querySelectorAll(".channel-item").forEach(el => el.classList.remove("active"));
      if (element) element.classList.add("active");

      titleEl.textContent = channel.name;
      subEl.textContent = `${channel.group} | ${channel.tag}`;
      statusEl.textContent = "جاري التحميل...";

      cleanupPlayer();

      if (window.location.protocol === "https:" && channel.url.startsWith("http://")) {
        statusEl.textContent = "رابط HTTP غير مدعوم على HTTPS";
        return;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(channel.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          statusEl.textContent = "مباشر";
          if (shouldAutoplay) {
            video.play().catch(() => { statusEl.textContent = "جاهز للتشغيل"; });
          }
        });

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data && data.fatal) {
            statusEl.textContent = "تعذر التشغيل / محجوب";
            if (hls) { hls.destroy(); hls = null; }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.url;
        video.addEventListener("loadedmetadata", () => {
          statusEl.textContent = "مباشر";
          if (shouldAutoplay) video.play().catch(() => { statusEl.textContent = "جاهز للتشغيل"; });
        }, { once: true });
        video.addEventListener("error", () => { statusEl.textContent = "تعذر التشغيل / محجوب"; }, { once: true });
      } else {
        statusEl.textContent = "المتصفح لا يدعم HLS";
      }
    }

    function setCategory(category, btnElement) {
      currentCategory = category;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      btnElement.classList.add("active");

      // إظهار زر الرجوع إذا لم نكن في وضع "الكل"، وإخفاؤه إذا كنا في "الكل"
      if (category === "all") {
        backBtn.style.display = "none";
      } else {
        backBtn.style.display = "flex";
      }

      filterChannels();
    }

    function goHome() {
      // العودة للوضع الرئيسي (الكل)
      const allBtn = document.querySelector(".tab-btn");
      setCategory("all", allBtn);
      document.getElementById("searchInput").value = "";
    }

    function renderChannels(filteredList) {
      listEl.innerHTML = "";
      countEl.textContent = `${filteredList.length} قنوات`;

      if (filteredList.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-sub);">لا توجد قنوات في هذا القسم حالياً</div>';
        return;
      }

      const groups = {};
      filteredList.forEach(ch => {
        const groupKey = ch.group || "أخرى";
        if (!groups[groupKey]) groups[groupKey] = [];
        groups[groupKey].push(ch);
      });

      let firstChannel = true;
      for (const [groupName, channels] of Object.entries(groups)) {
        const groupTitle = document.createElement("div");
        groupTitle.className = "group-title";
        groupTitle.textContent = groupName;
        listEl.appendChild(groupTitle);

        channels.forEach(ch => {
          const item = document.createElement("div");
          item.className = "channel-item";

          const img = document.createElement("img");
          img.src = ch.logo;
          img.alt = ch.name;
          img.onerror = () => { img.style.display = "none"; };

          const info = document.createElement("div");
          info.className = "channel-info";

          const nameDiv = document.createElement("div");
          nameDiv.classNa
